version: 1

training:
  window_jpx_sessions: 120
  minimum_complete_rows: 120
  feature_warmup_jpx_sessions: 20
  target: intraday_return

features:
  return_windows: [1, 2, 3, 5, 20]
  volatility_windows: [5, 20]
  moving_average_window: 20
  treasury_change_lags: [1, 3, 5]
  include_log_return: true
  include_open_close_return: true
  include_high_low_range: true
  # Fail a row above 20% missingness; fit any imputer on training data only.
  max_missing_ratio: 0.20
  missing_policy_status: confirmed

models:
  regression_primary: ridge
  regression_candidates:
    - ridge
    - elastic_net
    - ols
    - lasso
  classification_primary: logistic_regression
  classification_candidates:
    - logistic_regression
  scaler: standard_scaler
  # Every family is fitted and recorded each morning. None of them decide a
  # trade: regression_primary and classification_primary still do that.
  run_all_arms: true

cross_validation:
  strategy: time_series_split
  n_splits: 5
  gap: 0

hyperparameters:
  ridge_alpha: [0.01, 0.1, 1.0, 10.0, 100.0]
  elastic_net_alpha: [0.001, 0.01, 0.1, 1.0]
  elastic_net_l1_ratio: [0.1, 0.5, 0.9]
  logistic_c: [0.01, 0.1, 1.0, 10.0]
  # The forecast distribution. One alpha is chosen for the whole curve by
  # median pinball loss. The levels are evenly spaced so that each adjacent
  # pair holds exactly 5% of the probability mass, which is what turns the
  # curve into a density. 5%-95% is the range a 120-session window supports.
  quantile_alpha: [0.001, 0.01, 0.1]
  quantile_levels:
    [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
     0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

reproducibility:
  random_seed: 42
  deterministic: true
