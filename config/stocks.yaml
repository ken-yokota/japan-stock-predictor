version: 1

# Yahoo Finance symbols were verified against the requested `.T` convention.
# EODHD does not currently provide these Japanese equity prices, so its slots
# intentionally remain null rather than carrying guessed identifiers.
#
# 2026-08-12: the operator narrowed the universe to 海運・石油・金融. The
# automotive and trading-company names are disabled rather than deleted, so the
# verified symbol mapping survives and re-enabling one is a single-word edit.
# Nothing reads a disabled stock: ingestion, the morning and close pipelines,
# the walk-forward research runner and the earnings fetch all filter on
# `enabled`, so a disabled name costs no provider call and no feature row.
# Their already-published predictions stay in the database on purpose - the
# track record is not rewritten when the universe changes.
stocks:
  - ticker: "9101"
    name: "日本郵船"
    sector: shipping
    country_iso: JP
    exchange_mic: XTKS
    market_timezone: Asia/Tokyo
    provider_symbols:
      yahoo_finance: 9101.T
      eodhd: null
    enabled: true

