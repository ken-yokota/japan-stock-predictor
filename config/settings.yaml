version: 1

application:
  name: japan-stock-predictor
  timezone: Asia/Tokyo

# All times are wall-clock times in application.timezone.
schedule:
  morning_fetch: "08:20"
  prediction_cutoff: "08:30"
  email_send: "08:45"
  market_open: "09:00"
  market_close: "15:30"
  close_update: "15:45"

provider:
  primary: yahoo_finance
  treasury: us_treasury
  fallback:
    - eodhd_free
  # The optional EODHD Free fallback is capped per run to protect its quota.
  eodhd_free_max_calls_per_run: 5
  snapshot_freshness_minutes: 15
  request_timeout_seconds: 30.0
  max_retries: 3
  backoff_initial_seconds: 1.0

model:
  primary: ridge
  training_window_jpx_sessions: 120
  scaler: standard_scaler
  cross_validation: time_series_split

signal:
  predicted_intraday_return_threshold: 0.003
  # Raised from 0.60 on 2026-09-10. On the 110 live trades settled between
  # 2026-08-10 and 2026-09-10, the 0.60 rule returned a profit factor of 0.931
  # -- gross 535,450 against 575,250, a net of -39,800 yen. The losses were not
  # much more numerous than the wins so much as no smaller: 49.1% won, average
  # win 9,916 against average loss 10,272.
  #
  # Sweeping this one number is the only lever a fixed open-to-close hold has,
  # because the trade cannot be managed once it is on. 0.625 gives 1.184 on 94
  # trades, and it is chosen over 0.650 (1.213) as the lower edge of a plateau
  # rather than its peak: 0.625 through 0.675 all sit above 1.17, and the lower
  # edge is the point in a plateau least likely to be a selection artifact.
  # It also has the closest agreement between the two halves of the record
  # (1.308 and 1.112) and keeps all 18 sessions.
  #
  # This is a bet, not a proven improvement. 18 sessions, the threshold chosen
  # by looking at them, and a session bootstrap that puts the profit factor
  # above 1 in only 65% of draws. What it does rest on: at 0.60, removing any
  # one of 16 of the 18 sessions still leaves a profit factor below 1, so the
  # old value is a measured loser rather than an unlucky one. Standing still
  # was not the safe option. docs/research/2026-09-10-threshold.json records
  # the whole sweep, and scripts/verify_threshold.py re-judges it on sessions
  # after 2026-09-10 that this choice never saw.
  probability_up_threshold: 0.625

# Confirmed safety default: reject rows above 20% missingness. Imputers must be
# fit on training data only; this value never authorizes look-ahead filling.
data_quality:
  max_feature_missing_ratio: 0.20
  threshold_status: confirmed
  insufficient_data_prediction_status: INSUFFICIENT_DATA

# Zero per the operator's instruction on 2026-08-29: no orders are being
# placed, so there is nothing to charge. See config/trading.yaml for what this
# means for reading any P&L the system reports.
backtest:
  capital_per_stock_jpy: 1000000
  commission_bps_per_side: 0.0
  slippage_bps_per_side: 0.0
  cost_assumptions_status: confirmed
  quantity_method: floor_capital_div_open
  carry_overnight: false

environment:
  required:
    - DATABASE_URL
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - EMAIL_FROM
    - EMAIL_TO
    - APP_URL
    - TIMEZONE
  optional:
    - EODHD_API_KEY
    - RESEND_API_KEY
