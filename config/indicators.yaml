version: 1
provider_symbol_policy: official_verification_required

# Yahoo Finance is the primary free market-data route.  The official Treasury
# XML feed is primary for yields.  Verified EODHD symbols are optional fallback
# candidates only; all unconfirmed direct routes remain null and pending.
indicators:
  - id: sp500
    name: "S&P 500"
    category: equity_index
    required: true
    resolution_status: resolved
    sources:
      - kind: direct
        provider: yahoo_finance
        instrument_hint: "Yahoo Finance S&P 500 index"
        provider_symbol: "^GSPC"
        endpoint: yfinance.Ticker.history
        market: US_INDEX
        market_timezone: America/New_York
        data_mode: eod
        session_policy: previous_completed_session
        market_close: "16:00"
        is_proxy: false
        status: verified
        availability_at_0830: available
      - kind: direct
        provider: eodhd_free
        instrument_hint: "S&P 500 index"
        provider_symbol: null
        status: pending
        availability_at_0830: pending
      - kind: proxy
        provider: eodhd_free
        instrument_hint: "SPY"
        provider_symbol: SPY.US
        endpoint: "/eod/{ticker}"
        market: US
        market_timezone: America/New_York
