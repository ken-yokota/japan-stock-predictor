version: 1
provider_symbol_policy: official_verification_required

# Yahoo Finance is the primary free market-data route.  The official Treasury
# XML feed is primary for yields.  Verified EODHD symbols are optional fallback
# candidates only; all unconfirmed direct routes remain null and pending.
indicators:
  - id: dow
    name: "Dow Jones Industrial Average"
    category: equity_index
    required: true
    resolution_status: resolved
    sources:
      - kind: direct
        provider: yahoo_finance
        instrument_hint: "Yahoo Finance Dow Jones index"
        provider_symbol: "^DJI"
        endpoint: yfinance.Ticker.history
        market: US_INDEX
        market_timezone: America/New_York
        data_mode: eod
        session_policy: previous_completed_session
        market_close: "16:00"
        is_proxy: false
        status: verified
        availability_at_0830: available
      - kind: direct
        provider: eodhd_free
        instrument_hint: "Dow Jones Industrial Average"
        provider_symbol: null
        status: pending
        availability_at_0830: pending
      - kind: proxy
        provider: eodhd_free
        instrument_hint: "DIA"
        provider_symbol: DIA.US
        endpoint: "/eod/{ticker}"
        market: US
        market_timezone: America/New_York
        data_mode: eod
        session_policy: previous_completed_session
        market_close: "16:00"
        is_proxy: true
        status: verified
        availability_at_0830: available

  - id: vix
    name: "CBOE Volatility Index"
    category: volatility_index
    required: true
    resolution_status: resolved
    sources:
      - kind: direct
        provider: yahoo_finance
        instrument_hint: "Yahoo Finance VIX index"
        provider_symbol: "^VIX"
        endpoint: yfinance.Ticker.history
        market: US_INDEX
        market_timezone: America/New_York
        data_mode: eod
        session_policy: previous_completed_session
        market_close: "16:00"
        is_proxy: false
        status: verified
        availability_at_0830: available
      - kind: direct
        provider: eodhd_free
        instrument_hint: "VIX"
        provider_symbol: null
        status: pending
        availability_at_0830: pending

  - id: us_2y_yield
    name: "US 2-Year Treasury Yield"
    category: interest_rate
    required: true
    resolution_status: resolved
    sources:
      - kind: direct
        provider: eodhd_free
        instrument_hint: "US 2Y Yield"
        provider_symbol: null
        endpoint: null
        status: pending
        availability_at_0830: pending
        notes: "EODHD Free Treasury entitlement is not confirmed."
      - kind: direct
        provider: us_treasury
        instrument_hint: "Official Daily Treasury Par Yield Curve 2Y"
        endpoint: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value={year}"
        market: US_TREASURY
        market_timezone: America/New_York
        data_mode: yield_curve
        session_policy: provider_published_at_or_before_cutoff
        is_proxy: false
        status: verified
        availability_at_0830: conditional

  - id: us_10y_yield
    name: "US 10-Year Treasury Yield"
    category: interest_rate
    required: true
    resolution_status: resolved
    sources:
      - kind: direct
        provider: eodhd_free
        instrument_hint: "US 10Y Yield"
        provider_symbol: null
        endpoint: null
        status: pending
        availability_at_0830: pending
        notes: "EODHD Free Treasury entitlement is not confirmed."
      - kind: direct
        provider: us_treasury
        instrument_hint: "Official Daily Treasury Par Yield Curve 10Y"
        endpoint: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value={year}"
        market: US_TREASURY
        market_timezone: America/New_York
        data_mode: yield_curve
        session_policy: provider_published_at_or_before_cutoff
        is_proxy: false
        status: verified
        availability_at_0830: conditional

  - id: us_30y_yield
    name: "US 30-Year Treasury Yield"
    category: interest_rate
    required: true
    resolution_status: resolved
    sources:
      - kind: direct
        provider: eodhd_free
        instrument_hint: "US 30Y Yield"
        provider_symbol: null
        endpoint: null
        status: pending
        availability_at_0830: pending
        notes: "EODHD Free Treasury entitlement is not confirmed."
      - kind: direct
        provider: us_treasury
        instrument_hint: "Official Daily Treasury Par Yield Curve 30Y"
        endpoint: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value={year}"
        market: US_TREASURY
        market_timezone: America/New_York
        data_mode: yield_curve
        session_policy: provider_published_at_or_before_cutoff
        is_proxy: false
        status: verified
        availability_at_0830: conditional

  - id: us_10y_minus_2y_spread
    name: "US 10Y - 2Y Yield Spread"
    category: derived_interest_rate
    required: true
    resolution_status: resolved
    sources:
      - kind: derived
        provider: internal
        instrument_hint: "US 10Y yield minus US 2Y yield"
        data_mode: derived
        session_policy: derived_from_inputs
        is_proxy: false
        status: verified
        availability_at_0830: conditional
        inputs:
          - us_10y_yield
          - us_2y_yield
        notes: "Available only when both point-in-time-safe inputs are available."

common:
  # 実測した重要度（全22銘柄の回帰係数の絶対値合計）の上位5指標。
  # us_10y_yield は金利差の入力として必要なため併せて保持する。
  # 順位と根拠は docs/INDICATOR_RANKING.md を参照。
  - vix
  - us_10y_minus_2y_spread
  - us_2y_yield
  - dow
  - us_30y_yield
  - us_10y_yield

# 業種固有の追加は行わない。全銘柄が同じ6指標を見る。
sectors:
  shipping:
    indicators: []
    notes: "共通の6指標のみ。業種固有の追加はしない。"

  oil_energy:
    indicators: []
    notes: "共通の6指標のみ。業種固有の追加はしない。"

  automotive:
    indicators: []
    notes: "共通の6指標のみ。業種固有の追加はしない。"

  financial:
    indicators: []
    notes: "共通の6指標のみ。業種固有の追加はしない。"

  trading_company:
    indicators: []
    notes: "共通の6指標のみ。業種固有の追加はしない。"
