name: Coverage gap diagnose

# Manual only, read-only. Names the sessions each failing series is missing and
# classifies why, so the choice between "the provider has no data" and "we asked
# for a day this market never trades" is made on evidence rather than by
# relaxing the threshold until the message stops.
on:
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "JPX prediction date (YYYY-MM-DD); blank uses today in UTC"
        required: false
        type: string
      series:
        description: "Space-separated canonical symbols"
        required: false
        default: "usdjpy eurjpy audjpy oih kre"
        type: string

permissions:
  contents: read

concurrency:
  group: coverage-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREDICTION_DATE: ${{ inputs.prediction_date }}
      SERIES: ${{ inputs.series || 'usdjpy eurjpy audjpy oih kre' }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -e .
      - name: Name the missing sessions
        shell: bash
        run: |
          set -eo pipefail
          args=(--series $SERIES)
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--prediction-date "$PREDICTION_DATE")
          fi
          python -m scripts.diagnose_coverage_gaps "${args[@]}"
