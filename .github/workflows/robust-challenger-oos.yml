name: Compare fixed robust return challengers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application
        run: python -m pip install -e .

      - name: Compare on shared estimated-PIT windows in a read-only transaction
        run: >-
          python -m scripts.run_quant_audit_oos
          --output "$RUNNER_TEMP/robust-candidate-oos"
          --start 2026-01-01
          --end 2026-09-18
          --skip-compact
          --candidate-names huber extra_trees

      - name: Summarize common cohort and fixed cost scenarios
        run: >-
          python -m scripts.summarize_robust_candidate_oos
          --input "$RUNNER_TEMP/robust-candidate-oos"
          --output "$RUNNER_TEMP/robust-candidate-summary.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robust-challenger-oos
          path: ${{ runner.temp }}/robust-candidate-summary.json
          if-no-files-found: warn
          retention-days: 30
