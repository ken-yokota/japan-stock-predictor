name: Database usage inspect

# Manual only, read-only. Before anything is deleted or any schema changes,
# this establishes where the 512 MB actually goes: which tables and indexes
# hold the bytes, how many rows each day adds, and how much is the same
# logical row stored again.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application
        # The provenance audit needs the JPX calendar, which lives behind the
        # configuration stack; a driver-only install cannot answer whether a
        # date was a trading day.
        run: python -m pip install -e .

      - name: Measure the database
        run: python -m scripts.inspect_database_usage

      - name: Count the days that published on incomplete inputs
        run: python -m scripts.analyze_required_gaps

      - name: Audit predictions against outcomes
        continue-on-error: true
        run: python -m scripts.audit_prediction_accuracy

      - name: Audit which runs produced each day
        continue-on-error: true
        run: python -m scripts.audit_run_provenance

      - name: Audit the morning's data completeness
        continue-on-error: true
        run: python -m scripts.audit_morning_completeness
