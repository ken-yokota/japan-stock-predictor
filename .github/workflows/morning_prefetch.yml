name: Morning data prefetch

on:
  schedule:
    # 07:10/07:25 JST Monday-Friday. UTC is the preceding calendar day. This
    # follows the usual 18:00 ET Treasury publication and still leaves 55
    # minutes before the 08:20 snapshot/prediction window.
    # The second invocation is an idempotent retry: stored coverage suppresses
    # provider calls once the required EOD and Treasury sessions are complete.
    - cron: "10,25 22 * * 0-4"
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "JPX prediction date (YYYY-MM-DD); blank uses today in JST"
        required: false
        type: string
      force_non_business_day:
        description: "Prefetch history for a JPX holiday (reference prediction only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Do not let a severely delayed prefetch block the time-critical prediction.
  # PIT/unique gates keep an accidental overlap fail-closed and idempotent.
  group: morning-prefetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prefetch:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      TIMEZONE: Asia/Tokyo
      PREDICTION_DATE: ${{ inputs.prediction_date }}
      FORCE_NON_BUSINESS_DAY: ${{ inputs.force_non_business_day || false }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -e .
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Prefetch EOD and Treasury history
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--prediction-date "$PREDICTION_DATE")
          fi
          if [[ "$FORCE_NON_BUSINESS_DAY" == "true" ]]; then
            args+=(--force-non-business-day)
          fi
          python -m scripts.prefetch_morning_data "${args[@]}"
