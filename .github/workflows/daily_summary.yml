name: Daily summary

on:
  schedule:
    # 17:00 JST Monday-Friday (JST has no daylight-saving time), which is after
    # the 16:10 close-update run has written the day's actual results.
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      for_date:
        description: "Summary date (YYYY-MM-DD); blank uses today in JST"
        required: false
        type: string
      dry_run:
        description: "Render and log without sending"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summary:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMAIL_PROVIDER: gmail_smtp
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      APP_URL: ${{ secrets.APP_URL }}
      TIMEZONE: Asia/Tokyo
      FOR_DATE: ${{ inputs.for_date }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -e .
      - name: Send the day's summary
        shell: bash
        run: |
          args=()
          if [[ -n "$FOR_DATE" ]]; then
            args+=(--for-date "$FOR_DATE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m cli daily-summary "${args[@]}"
