name: Daily summary

on:
  schedule:
    # 17:00 / 17:20 / 17:40 JST Monday-Friday (JST has no daylight-saving
    # time), all after the 16:10 close-update run has written the day's actual
    # results. Three ticks because GitHub does not guarantee that a scheduled
    # run fires at all -- on 2026-08-12 the morning cron simply did not -- and
    # this is the mail the operator asked to receive every single day. The send
    # is keyed on the date in email_logs, so the second and third ticks find
    # the first one's delivery and exit without mailing again.
    - cron: "0 8 * * 1-5"
    - cron: "20 8 * * 1-5"
    - cron: "40 8 * * 1-5"
  workflow_dispatch:
    inputs:
      for_date:
        description: "Summary date (YYYY-MM-DD); blank uses today in JST"
        required: false
        type: string
      dry_run:
        description: "Render and log without sending"
        required: false
        default: true
        type: boolean
      force:
        description: "Send again even if this date was already delivered"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summary:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMAIL_PROVIDER: gmail_smtp
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      APP_URL: ${{ secrets.APP_URL }}
      TIMEZONE: Asia/Tokyo
      FOR_DATE: ${{ inputs.for_date }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      FORCE: ${{ inputs.force || false }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -e .
      - name: Apply database migrations
        # The delivery record this job writes needs 0004. The close update
        # already migrates at 15:45, but this job must not depend on another
        # workflow having fired to be able to record its own send.
        run: python -m alembic upgrade head
      - name: Send the day's summary
        shell: bash
        run: |
          args=()
          if [[ -n "$FOR_DATE" ]]; then
            args+=(--for-date "$FOR_DATE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python -m cli daily-summary "${args[@]}"
