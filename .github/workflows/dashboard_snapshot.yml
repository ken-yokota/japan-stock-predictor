name: Dashboard snapshot

on:
  schedule:
    # 08:40 JST (after the prediction lands), 16:20 JST (after the close
    # update) and 17:10 JST (after the daily summary). Monday-Friday.
    - cron: "40 23 * * 0-4"
    - cron: "20 7 * * 1-5"
    - cron: "10 8 * * 1-5"
  workflow_dispatch:

# The snapshot is force-pushed to its own branch, so it needs write access.
# Nothing else in this repository does; keep it scoped to this workflow.
permissions:
  contents: write

concurrency:
  group: dashboard-snapshot
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TIMEZONE: Asia/Tokyo

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application
        run: python -m pip install -e .

      - name: Build the snapshot
        # Written outside the working tree so the orphan commit below can be
        # made to contain this one file and nothing else.
        run: >-
          python -m scripts.export_dashboard_snapshot
          --output "$RUNNER_TEMP/dashboard_snapshot.json"

      - name: Publish it to the snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A fresh orphan commit each time: the branch stays one commit deep,
          # so publishing every weekday cannot grow the repository without
          # bound, and there is never a merge to resolve.
          git checkout --orphan snapshot-publish
          git rm -rf --cached . >/dev/null
          cp "$RUNNER_TEMP/dashboard_snapshot.json" dashboard_snapshot.json
          git add --force dashboard_snapshot.json
          git commit -m "Publish dashboard snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push --force origin snapshot-publish:snapshot
          echo "published: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/snapshot/dashboard_snapshot.json"
