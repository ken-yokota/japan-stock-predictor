name: Close update

on:
  schedule:
    # 15:45/15:55/16:10 JST Monday-Friday.
    - cron: "45 6 * * 1-5"
    - cron: "55 6 * * 1-5"
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "JPX prediction date (YYYY-MM-DD); blank uses today in JST"
        required: false
        type: string
      dry_run:
        description: "Validate close values without finalizing results"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: close-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TIMEZONE: Asia/Tokyo
      PREDICTION_DATE: ${{ inputs.prediction_date }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -e .
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Finalize actuals or leave them pending
        shell: bash
        run: |
          args=()
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--prediction-date "$PREDICTION_DATE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m scripts.run_close_update "${args[@]}"
