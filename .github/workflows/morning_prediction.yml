name: Morning prediction

on:
  schedule:
    # 08:10/08:20/08:30 JST Monday-Friday (JST has no daylight-saving time).
    # The retries tolerate GitHub's non-guaranteed cron start time; successful
    # publication is idempotent, so later invocations return the existing set.
    # The first setup runs before the 08:20 snapshot window and waits below.
    # Existing EOD history is incrementally skipped, while fresh snapshots are
    # evaluated against the fixed 08:30 cutoff. A delayed snapshot is excluded
    # by the PIT gate rather than used after its allowed age.
    #
    # Ten model families per ticker, fitted three at a time: the target is
    # about 12 minutes from the 08:20 snapshot, so roughly 08:32, which leaves
    # 13 minutes before the first 08:45 email attempt. Serially the same work
    # took 30 minutes and would have finished after the last email attempt had
    # already reported "no prediction".
    - cron: "10,20,30 23 * * 0-4"
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "JPX prediction date (YYYY-MM-DD); blank uses today in JST"
        required: false
        type: string
      dry_run:
        description: "Build and validate without publishing predictions"
        required: false
        default: false
        type: boolean
      skip_ingestion:
        description: "Reuse persisted PIT-valid inputs without fetching"
        required: false
        default: false
        type: boolean
      force_non_business_day:
        description: "Publish a reference prediction on a JPX holiday (no actual settles)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: morning-prediction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      TIMEZONE: Asia/Tokyo
      PREDICTION_DATE: ${{ inputs.prediction_date }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      SKIP_INGESTION: ${{ inputs.skip_ingestion || false }}
      FORCE_NON_BUSINESS_DAY: ${{ inputs.force_non_business_day || false }}
      # The prediction now fits three tickers at once, and each of those also
      # runs a torch subprocess. Every numerical library defaults to one thread
      # per core, so without these the runner would carry roughly thirty
      # compute threads on four vCPUs. Measured on a four-core machine that
      # took the load average past 800 and completed nothing at all -- it does
      # not fail, it simply stops progressing, which is the worst shape for a
      # job with a deadline.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      TORCH_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -e .
      # torch publishes no Python 3.14 wheel, and this project runs 3.14 by
      # deliberate choice. The sequence arms therefore get their own
      # interpreter and talk to the main process over a JSON document. Set up
      # before the prediction step so a failure here is attributed to the
      # environment rather than to the model.
      # update-environment: false is load-bearing. setup-python prepends to
      # PATH, so a second call without it would leave `python` pointing at
      # 3.12 for every later step -- the migrations and the prediction itself
      # would silently run on the wrong interpreter against a dependency set
      # that was never installed there. The path is taken from the step output
      # instead and used only to build the sibling environment.
      - name: Set up Python 3.12 for the sequence models
        id: neural-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          update-environment: false
      - name: Build the sequence-model environment
        shell: bash
        timeout-minutes: 15
        env:
          NEURAL_PYTHON: ${{ steps.neural-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$NEURAL_PYTHON" -m venv .venv-neural
          .venv-neural/bin/python -m pip install --quiet --upgrade pip
          # The CPU index, explicitly. On Linux the default torch wheel bundles
          # CUDA and is about 2.5 GB; this runner has no GPU, so that download
          # would be pure cost and could not finish inside this step's budget.
          # The CPU build is roughly a tenth of the size.
          .venv-neural/bin/python -m pip install --quiet \
            --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          # numpy comes from PyPI, and is held below 2 because torch 2.x is
          # built against the 1.x ABI.
          .venv-neural/bin/python -m pip install --quiet "numpy<2"
          .venv-neural/bin/python -c "import torch; print('torch', torch.__version__)"
          # Prove it is the CPU build, so a silent switch back to the CUDA
          # wheel shows up here rather than as a slow morning nobody explains.
          .venv-neural/bin/python -c "
          import torch
          assert not torch.version.cuda, f'expected the CPU build, got CUDA {torch.version.cuda}'
          print('CPU build confirmed')
          "
      - name: Confirm the interpreters are the right way round
        shell: bash
        run: |
          set -euo pipefail
          # The main interpreter must still be 3.14. If a future edit reorders
          # the setup steps this fails here, loudly, rather than at 08:10 on a
          # weekday with a wrong-interpreter traceback.
          python - <<'PY'
          import sys
          version = f"{sys.version_info.major}.{sys.version_info.minor}"
          print("main interpreter:", version)
          if version != "3.14":
              raise SystemExit(f"expected the main interpreter to be 3.14, got {version}")
          PY
          # A smoke test rather than a trust exercise. If this reports the
          # environment missing, the arms come back UNAVAILABLE and the morning
          # still publishes -- but the log says so instead of the rows quietly
          # going missing.
          python -c "
          from models.sequence import neural_environment_status
          print('sequence environment:', neural_environment_status())
          "
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Wait for the 08:20 JST snapshot window
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import math
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          jst = ZoneInfo("Asia/Tokyo")
          now = datetime.now(jst)
          target = now.replace(hour=8, minute=20, second=0, microsecond=0)
          # A severely delayed cron must never sleep toward the wrong day's
          # window. The intended 08:10 firing needs at most ten minutes.
          wait_seconds = min(
              15 * 60,
              max(0, math.ceil((target - now).total_seconds())),
          )
          print(
              f"PIT snapshot wait: {wait_seconds}s "
              f"(now={now:%H:%M:%S}, target={target:%H:%M:%S} JST)",
              flush=True,
          )
          if wait_seconds:
              time.sleep(wait_seconds)
          PY
      - name: Build morning predictions
        shell: bash
        timeout-minutes: 60
        run: |
          set -eo pipefail
          args=()
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--prediction-date "$PREDICTION_DATE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$SKIP_INGESTION" == "true" ]]; then
            args+=(--skip-ingestion)
          fi
          if [[ "$FORCE_NON_BUSINESS_DAY" == "true" ]]; then
            args+=(--force-non-business-day)
          fi
          python -m scripts.run_morning_prediction "${args[@]}"
