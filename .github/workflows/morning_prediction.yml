name: Morning prediction

on:
  schedule:
    # 07:00 JST Monday-Friday (JST has no daylight-saving time).
    #
    # The fetch walks 59 series one at a time to respect free-provider rate
    # limits and has taken over 34 minutes when Yahoo throttles. Starting at
    # 08:20 left under 25 minutes before the 08:45 email, so a throttled
    # morning would mail before the prediction existed. 07:00 leaves 105
    # minutes.
    #
    # Starting earlier costs no information: the prediction cutoff stays fixed
    # at 08:30 JST, and the US session that feeds it closes around 05:00 JST,
    # so nothing the model uses arrives between 07:00 and 08:30.
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "JPX prediction date (YYYY-MM-DD); blank uses today in JST"
        required: false
        type: string
      dry_run:
        description: "Build and validate without publishing predictions"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: morning-prediction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      TIMEZONE: Asia/Tokyo
      PREDICTION_DATE: ${{ inputs.prediction_date }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -e .
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Build morning predictions
        shell: bash
        run: |
          args=()
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--prediction-date "$PREDICTION_DATE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m scripts.run_morning_prediction "${args[@]}"
