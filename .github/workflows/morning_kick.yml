name: Morning kick

# One call that runs the whole morning, for an external scheduler to trigger.
#
# GitHub does not guarantee when a scheduled workflow starts. On 2026-08-13 the
# three morning-email ticks - 08:45, 08:50 and 08:55 JST - were all released
# together at 09:44, which is the shape of a queue draining rather than of one
# tick being unlucky. Adding ticks cannot help: they queue behind the same
# backlog and arrive together too. Only a trigger from outside GitHub can put
# the morning back on the clock.
#
# Every step here is idempotent. If the scheduled runs already did the work,
# this finds it done and returns; if they never fired, this does it. Running
# both is therefore safe, which is what lets the external trigger be added
# without removing the crons it is insuring against.
on:
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "JPX prediction date (YYYY-MM-DD); blank uses today in JST"
        required: false
        type: string
      skip_prefetch:
        description: "Go straight to the prediction"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Shares the prediction's group: a kick must queue behind a scheduled run
  # rather than race it into the same publication.
  group: morning-prediction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      EMAIL_PROVIDER: gmail_smtp
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      APP_URL: ${{ secrets.APP_URL }}
      TIMEZONE: Asia/Tokyo
      PREDICTION_DATE: ${{ inputs.prediction_date }}
      SKIP_PREFETCH: ${{ inputs.skip_prefetch || false }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -e .
      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Prefetch history
        # Never fatal. A prefetch that fails leaves the prediction to fetch what
        # it needs itself, and stopping here would trade a partial morning for
        # no morning at all.
        if: ${{ inputs.skip_prefetch != true }}
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          args=()
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--prediction-date "$PREDICTION_DATE")
          fi
          python -m scripts.prefetch_morning_data "${args[@]}"

      - name: Build the prediction
        shell: bash
        run: |
          set -eo pipefail
          args=()
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--prediction-date "$PREDICTION_DATE")
          fi
          python -m scripts.run_morning_prediction "${args[@]}"

      - name: Send the morning email
        shell: bash
        run: |
          set -eo pipefail
          args=()
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--prediction-date "$PREDICTION_DATE")
          fi
          python -m scripts.send_morning_email "${args[@]}"

      - name: Audit what the morning was owed
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--date "$PREDICTION_DATE")
          fi
          python -m scripts.audit_morning_completeness "${args[@]}"
