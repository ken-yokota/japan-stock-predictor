name: Morning email

on:
  schedule:
    # 08:45/08:50/08:55 JST Monday-Friday; DB idempotency sends at most once.
    - cron: "45,50,55 23 * * 0-4"
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "JPX prediction date (YYYY-MM-DD); blank uses today in JST"
        required: false
        type: string
      dry_run:
        description: "Render and log without external delivery"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: morning-email-${{ github.ref }}
  cancel-in-progress: false

jobs:
  email:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMAIL_PROVIDER: gmail_smtp
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      APP_URL: ${{ secrets.APP_URL }}
      TIMEZONE: Asia/Tokyo
      PREDICTION_DATE: ${{ inputs.prediction_date }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application
        run: python -m pip install -e .
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Send persisted prediction email once
        shell: bash
        run: |
          args=()
          if [[ -n "$PREDICTION_DATE" ]]; then
            args+=(--prediction-date "$PREDICTION_DATE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m scripts.send_morning_email "${args[@]}"
