[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-stock-predictor"
version = "0.1.0"
description = "Point-in-time-safe Japanese stock intraday prediction application"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Private"}
dependencies = [
  "alembic>=1.13,<2",
  "exchange-calendars>=4.6,<5",
  "httpx>=0.27,<1",
  "lightgbm>=4.5,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.22,<7",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "resend>=2.4,<3",
  "scikit-learn>=1.5,<2",
  "SQLAlchemy>=2.0.31,<3",
  "statsmodels>=0.14,<1",
  "streamlit>=1.36,<2",
  "xgboost>=2.1,<4",
  "yfinance>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "backtest*",
  "dashboard*",
  "data*",
  "database*",
  "features*",
  "metrics*",
  "models*",
  "notifications*",
  "pipeline*",
  "research*",
  "scoring*",
  "scripts*",
  "services*",
  "trading*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The report text sets these full-width marks against kanji on purpose. Their
# ASCII lookalikes leave a visible half-width gap in the rendered mail, so the
# ambiguity warning is not actionable here.
allowed-confusables = ["（", "）", "／", "：", "，", "－"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "exchange_calendars",
  "pandas",
  "pandas.*",
  "yfinance",
  "yfinance.*",
]
ignore_missing_imports = true
